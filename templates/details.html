{% extends "base.html" %}

{% block bgcolor %}lightcyan{% endblock bgcolor %}

{% block content %}

<a href="{{url_for('index')}}"class= "btn btn-primary">GoBack</a>

<a onclick = "confirmDelete() "class= "btn btn-danger" >Delete</a>

<a href="{{url_for('update', id=st.id)}}"class = "btn btn-info">Update</a>


<script>
    function confirmDelete()
    {
        res = confirm("Are you sure you want to delete this?");
        if (res == true) 
        {
            window.location.href = '/delete/{{st.id}}';
        }

    }

</script>
<h1>{{st.id}}</h1>
<h1>{{st.name}}</h1>
<h1>{{st.family}}</h1>


{% endblock content %}
